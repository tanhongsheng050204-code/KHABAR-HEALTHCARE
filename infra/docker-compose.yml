version: '3.8'

services:
  khabar-api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: khabar-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8080
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-dev-internal-secret}
      - AGENTS_SERVICE_URL=http://khabar-agents:8000
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - WEB_ALLOWED_ORIGINS=${WEB_ALLOWED_ORIGINS:-http://localhost:3000}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_CHECKIN_TEMPLATE=${WHATSAPP_CHECKIN_TEMPLATE:-}
      - WHATSAPP_SUMMARY_TEMPLATE=${WHATSAPP_SUMMARY_TEMPLATE:-}
      - KHABAR_BOOTSTRAP_TOKEN=${KHABAR_BOOTSTRAP_TOKEN:-}
      - FAVORIOT_DEVICE_SECRET=${FAVORIOT_DEVICE_SECRET:-}
      - SPRING_DATASOURCE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/khabar}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in infra/.env (openssl rand -hex 32)}
      # The patient graph: Spring Boot writes it, the agents read it
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    depends_on:
      - khabar-agents
    networks:
      - khabar-network

  khabar-agents:
    build:
      context: ../services/agents
      dockerfile: Dockerfile
    container_name: khabar-agents
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-dev-internal-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    networks:
      - khabar-network

  # Optional local services for development if cloud Supabase/Neo4j is not connected yet
  postgres:
    image: postgres:16-alpine
    container_name: khabar-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=khabar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - khabar-network

  neo4j:
    image: neo4j:5-community
    container_name: khabar-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j-data:/data
    networks:
      - khabar-network

networks:
  khabar-network:
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:

