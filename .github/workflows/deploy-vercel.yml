name: Deploy Khabar web to Vercel

# Every push to main that changes the web app goes live on khabar-landing.
# The API and agents (services/) are a separate Vercel project and are deployed by hand.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

concurrency:
  group: khabar-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Check, build and deploy production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A broken UI never reaches the live site: lint and type errors stop the deploy.
      - name: Lint and type-check
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@59.26.0

      # Explains "Project not found" without printing any secret.
      - name: Check Vercel access
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "::error::$name holds more than letters, digits and _ (often a line break or byte-order mark added when it was saved)"
              exit 1
            fi
          done
          echo "Token belongs to: $(vercel whoami)"
          echo "Projects the token can see in the VERCEL_ORG_ID team:"
          VERCEL_PROJECT_ID= vercel project ls --scope "$VERCEL_ORG_ID"

      # The project's Root Directory is web/, so these run from the repository root.
      - name: Pull production configuration
        run: vercel pull --yes --environment=production

      - name: Build production application
        run: vercel build --prod

      - name: Deploy production application
        run: vercel deploy --prebuilt --prod
