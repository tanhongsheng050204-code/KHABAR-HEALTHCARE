server:
  port: ${PORT:8080}

spring:
  application:
    name: khabar-api

  # PostgreSQL (Supabase in the cloud). Every secret comes from the environment:
  # there are deliberately no working defaults, so a missing value fails at startup.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/khabar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

khabar:
  security:
    internal-service-key: ${INTERNAL_SERVICE_KEY:}
    # Supabase: set SUPABASE_JWKS_URL (new projects) or SUPABASE_JWT_SECRET (legacy HS256 projects)
    supabase-jwks-url: ${SUPABASE_JWKS_URL:}
    supabase-jwt-secret: ${SUPABASE_JWT_SECRET:}
    # 64 hex characters. Generate with: openssl rand -hex 32
    field-encryption-key: ${FIELD_ENCRYPTION_KEY:}
  services:
    agents-url: ${AGENTS_SERVICE_URL:http://localhost:8000}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  time-zone: ${KHABAR_TIME_ZONE:Asia/Kuala_Lumpur}
  # WhatsApp Cloud API. Leave the phone number id or token empty to keep messages in the outbox table.
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
    # Approved template for check-ins (they start the conversation, so WhatsApp requires a template)
    checkin-template: ${WHATSAPP_CHECKIN_TEMPLATE:}
    # Approved template for visit summaries, with one body parameter {{1}} that carries the summary
    summary-template: ${WHATSAPP_SUMMARY_TEMPLATE:}
    # Webhook: the token you type into Meta's dashboard, and the app secret that signs deliveries
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
  checkins:
    scheduler-enabled: ${CHECKINS_SCHEDULER_ENABLED:true}
    poll-ms: ${CHECKINS_POLL_MS:60000}
  # Lets the very first doctor create a clinic (POST /api/onboarding/clinic). Leave empty to switch that off.
  onboarding:
    bootstrap-token: ${KHABAR_BOOTSTRAP_TOKEN:}
